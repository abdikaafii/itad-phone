<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050F22">
<title>ITAD PhoneSeal test</title>
<style>
:root{--bg:#050F22;--bg2:#081831;--card:#0B1F40;--line:#1A3966;--hi:#2B5FA8;
--blue:#1E7BFF;--blue2:#2E9BFF;--cyan:#38BDF8;--text:#EAF2FF;--muted:#8EA6C8;
--ok:#34D399;--okd:#1FA971;--bad:#F87171;--badd:#C62F2F;--warn:#FBBF24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
-webkit-user-select:none;user-select:none}
header{padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
background:linear-gradient(180deg,#06132A,#081831);border-bottom:1px solid var(--line);
position:sticky;top:0;z-index:5}
.brand{font-weight:800;font-size:22px;letter-spacing:.5px}
.brand b{color:var(--blue2)}
.sub{color:var(--cyan);font-size:11px;letter-spacing:3px;margin-top:2px}
.job{color:var(--muted);font-size:13px;margin-top:6px}
.prog{height:8px;background:#0F2447;border-radius:6px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--okd);transition:width .4s}
main{padding:14px 14px 120px}
.t{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
border-radius:14px;padding:14px;margin-bottom:10px}
.t .n{flex:1}
.t .n div{font-weight:650;font-size:17px}
.t .n small{color:var(--muted);font-size:12px}
.st{font-weight:800;font-size:13px;padding:6px 10px;border-radius:20px;background:#0F2447;color:var(--muted)}
.st.PASS{background:#0E3B2E;color:var(--ok)}.st.FAIL{background:#3B1212;color:var(--bad)}
.st.NA{background:#1A2234;color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:28px;padding:16px;font-size:17px;font-weight:750;
color:#fff;background:var(--blue);margin-top:10px}
.btn.ok{background:var(--okd)}.btn.bad{background:var(--badd)}.btn.ghost{background:transparent;border:2px solid var(--hi);color:var(--muted)}
.row{display:flex;gap:10px}.row .btn{flex:1}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
background:linear-gradient(0deg,#050F22 70%,transparent)}
.panel{position:fixed;inset:0;background:var(--bg2);z-index:20;display:none;flex-direction:column;
padding:calc(16px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom))}
.panel.on{display:flex}
.panel h2{margin:4px 0 6px;font-size:24px}
.panel p{color:var(--muted);margin:0 0 10px;line-height:1.4}
.grow{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
video{width:100%;max-height:52vh;border-radius:14px;background:#000;object-fit:cover}
.meter{width:100%;height:22px;background:#0F2447;border-radius:12px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--cyan)}
.big{font-size:44px;font-weight:800}
#touch{position:fixed;inset:0;z-index:30;display:none;background:#000;touch-action:none}
#touch .bar{position:absolute;left:0;right:0;top:0;height:calc(54px + env(safe-area-inset-top));
padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;
padding-left:14px;padding-right:8px;background:rgba(8,24,49,.92);z-index:2}
#touch .bar button{border:0;border-radius:18px;background:var(--badd);color:#fff;font-weight:700;padding:8px 14px}
#grid{position:absolute;left:0;right:0;bottom:0;display:grid}
#grid div{border:1px solid #0E2140;background:#081831}
#grid div.on{background:var(--okd);border-color:#13784E}
#color{position:fixed;inset:0;z-index:30;display:none}
#color span{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;
font-weight:700;mix-blend-mode:difference;color:#fff}
.chk{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);
border-radius:12px;padding:12px;margin-bottom:8px;font-size:16px}
.chk .opts button{border:0;border-radius:16px;margin-left:6px;padding:8px 12px;font-weight:750;background:#0F2447;color:var(--muted)}
.chk .opts button.s1{background:var(--okd);color:#fff}.chk .opts button.s2{background:var(--badd);color:#fff}
.chk .opts button.s3{background:#334155;color:#fff}
#done{text-align:center;padding:30px 10px;display:none}
.demo{color:var(--warn);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="brand">IT<b>AD</b> PhoneSeal</div>
  <div class="sub">SECURE • TEST • CERTIFY</div>
  <div class="job">Job: __JOB__ &nbsp;•&nbsp; <span id="count">0</span> of <span id="total">0</span> tests done</div>
  <div class="prog"><i id="bar"></i></div>
</header>
<main id="list"></main>
<div id="done"><div class="big" style="color:var(--ok)">All done</div>
<p style="color:var(--muted)">Results are on the station. You can put this phone down.</p></div>
<div id="bottom"><button class="btn" id="runall">Start tests</button></div>

<!-- generic test panel -->
<div class="panel" id="panel">
  <h2 id="ptitle"></h2><p id="ptext"></p>
  <div class="grow" id="pbody"></div>
  <div id="pbtns"></div>
</div>
<!-- touch grid -->
<div id="touch"><div class="bar"><b id="tleft">Swipe over every square</b>
<button id="tfail">Dead spot - FAIL</button></div><div id="grid"></div></div>
<!-- colour test -->
<div id="color"><span>Tap for the next colour</span></div>

<script>
"use strict";
const TOKEN="__TOKEN__";
const TESTS=[
 {id:"Touch screen",   d:"Swipe your finger over every square"},
 {id:"Multi-touch",    d:"Touch the screen with two fingers"},
 {id:"Display",        d:"Full-screen colours: look for dead pixels or lines"},
 {id:"Speakers",       d:"Play a tone and listen"},
 {id:"Microphone",     d:"Talk, then listen to the recording"},
 {id:"Front camera",   d:"Live picture from the front camera"},
 {id:"Rear camera",    d:"Live picture from the back camera"},
 {id:"Vibration",      d:"The phone vibrates (Android)"},
 {id:"Motion sensors", d:"Tilt the phone"},
 {id:"Buttons & ports",d:"Check each button and part by hand"},
];
const R={};               // results
let queue=null;           // run-all order

function post(name,status,note,auto){
  R[name]={status,note:note||"",auto:!!auto};
  fetch("/t/"+TOKEN+"/result",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name,status,note,auto})}).catch(()=>{});
  draw();
}
function draw(){
  const L=document.getElementById("list"); L.innerHTML="";
  TESTS.forEach(t=>{
    const r=R[t.id]; const s=r?r.status:"";
    const el=document.createElement("div"); el.className="t";
    el.innerHTML='<div class="n"><div>'+t.id+'</div><small>'+(r&&r.note?r.note:t.d)+'</small></div>'+
      '<span class="st '+(s==="N/A"?"NA":s)+'">'+(s||"to do")+'</span>';
    el.onclick=()=>{queue=null;run(t.id)}; L.appendChild(el);
  });
  const n=TESTS.filter(t=>R[t.id]).length;
  document.getElementById("count").textContent=n;
  document.getElementById("total").textContent=TESTS.length;
  document.getElementById("bar").style.width=(100*n/TESTS.length)+"%";
  document.getElementById("runall").textContent=n?"Continue tests":"Start tests";
  if(n===TESTS.length){document.getElementById("done").style.display="block";
    document.getElementById("bottom").style.display="none"}
}
function next(){
  closePanel();
  if(!queue) return;
  const t=queue.shift(); if(t) run(t); else queue=null;
}
document.getElementById("runall").onclick=()=>{
  queue=TESTS.filter(t=>!R[t.id]).map(t=>t.id); next();
};
// ---------- panel helpers ----------
const P=document.getElementById("panel");
let cleanup=null;
function panel(title,text,body,buttons){
  document.getElementById("ptitle").textContent=title;
  document.getElementById("ptext").textContent=text;
  const B=document.getElementById("pbody"); B.innerHTML=""; if(body) B.appendChild(body);
  const K=document.getElementById("pbtns"); K.innerHTML="";
  const row=document.createElement("div"); row.className="row";
  buttons.forEach(([label,cls,fn])=>{const b=document.createElement("button");
    b.className="btn "+cls; b.textContent=label; b.onclick=fn; row.appendChild(b)});
  K.appendChild(row);
  const skip=document.createElement("button"); skip.className="btn ghost"; skip.textContent="Skip for now";
  skip.onclick=next; K.appendChild(skip);
  P.classList.add("on");
}
function closePanel(){P.classList.remove("on"); if(cleanup){try{cleanup()}catch(e){} cleanup=null}}
function pf(name,okNote,badNote,auto){
  return [["PASS","ok",()=>{post(name,"PASS",okNote,auto);next()}],
          ["FAIL","bad",()=>{post(name,"FAIL",badNote,auto);next()}]];
}
function el(html){const d=document.createElement("div");d.style.width="100%";d.innerHTML=html;return d}
// ---------- tests ----------
function run(id){
  ({"Touch screen":touch,"Multi-touch":multi,"Display":display,"Speakers":speakers,
    "Microphone":mic,"Front camera":()=>camera("Front camera","user"),
    "Rear camera":()=>camera("Rear camera","environment"),"Vibration":vibration,
    "Motion sensors":sensors,"Buttons & ports":buttons})[id]();
}
function touch(){
  const T=document.getElementById("touch"),G=document.getElementById("grid");
  const cols=6,rows=11; G.innerHTML="";
  G.style.top=document.querySelector("#touch .bar").offsetHeight+"px";
  G.style.gridTemplateColumns="repeat("+cols+",1fr)";G.style.gridTemplateRows="repeat("+rows+",1fr)";
  const cells=[];for(let i=0;i<cols*rows;i++){const c=document.createElement("div");G.appendChild(c);cells.push(c)}
  T.style.display="block"; let left=cols*rows;
  const hit=(x,y)=>{const e=document.elementFromPoint(x,y);
    if(e&&e.parentNode===G&&!e.classList.contains("on")){e.classList.add("on");left--;
      document.getElementById("tleft").textContent=left?left+" squares left":"All squares done";
      if(!left){setTimeout(()=>{T.style.display="none";post("Touch screen","PASS","all "+cols*rows+" squares touched",true);next()},300)}}};
  const mv=e=>{e.preventDefault();for(const t of e.touches)hit(t.clientX,t.clientY)};
  T.ontouchstart=mv;T.ontouchmove=mv;
  T.onmousemove=e=>{if(e.buttons)hit(e.clientX,e.clientY)};
  document.getElementById("tfail").onclick=()=>{T.style.display="none";
    post("Touch screen","FAIL",left+" squares could not be touched",false);next()};
}
function multi(){
  const b=el('<div class="big" id="mt">0 fingers</div>');
  let best=0;
  const h=e=>{best=Math.max(best,e.touches.length);
    document.getElementById("mt").textContent=e.touches.length+" finger"+(e.touches.length===1?"":"s");
    if(e.touches.length>=2){document.removeEventListener("touchstart",h);
      post("Multi-touch","PASS",e.touches.length+" touches at once",true);setTimeout(next,400)}};
  document.addEventListener("touchstart",h);
  cleanup=()=>document.removeEventListener("touchstart",h);
  panel("Multi-touch","Put two fingers on the screen at the same time.",b,
        [["FAIL","bad",()=>{post("Multi-touch","FAIL","only "+best+" touch seen");next()}]]);
}
function display(){
  const C=document.getElementById("color");
  const cols=[["#FF0000","Red"],["#00FF00","Green"],["#0000FF","Blue"],["#FFFFFF","White"],["#000000","Black"],["#808080","Grey"]];
  let i=0; C.style.display="block"; C.style.background=cols[0][0];
  try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}
  C.onclick=()=>{i++; if(i<cols.length){C.style.background=cols[i][0];return}
    C.style.display="none"; try{document.exitFullscreen&&document.exitFullscreen()}catch(e){}
    panel("Display","Did you see dead pixels, lines, marks or burn-in on any colour?",null,
      [["No - PASS","ok",()=>{post("Display","PASS","6 colours checked, no faults seen");next()}],
       ["Yes - FAIL","bad",()=>{post("Display","FAIL","fault seen on the display");next()}]]);};
}
let AC=null;
function tone(pan){
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  AC.resume&&AC.resume();
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.value=660;g.gain.value=0.0001;
  let node=g;
  if(AC.createStereoPanner&&pan!==0){const p=AC.createStereoPanner();p.pan.value=pan;g.connect(p);node=p}
  o.connect(g);node.connect(AC.destination);
  const t=AC.currentTime;g.gain.exponentialRampToValueAtTime(0.6,t+0.05);
  g.gain.exponentialRampToValueAtTime(0.0001,t+1.2);o.start(t);o.stop(t+1.3);
}
function speakers(){
  const b=el('<div class="row"><button class="btn ghost" id="sl">Left</button>'+
    '<button class="btn" id="sb">Both</button><button class="btn ghost" id="sr">Right</button></div>'+
    '<p style="text-align:center;margin-top:14px">Turn the volume up. Many phones have one loud speaker at the bottom and one at the top.</p>');
  panel("Speakers","Play the tone. Is it clear, with no crackling?",b,
        pf("Speakers","tone clear","speaker fault (no sound / crackling)"));
  document.getElementById("sl").onclick=()=>tone(-1);
  document.getElementById("sb").onclick=()=>tone(0);
  document.getElementById("sr").onclick=()=>tone(1);
}
function mic(){
  const b=el('<div class="meter"><i id="lv"></i></div><p id="mtxt" style="text-align:center">Allow the microphone, then talk.</p>'+
    '<button class="btn" id="rec">Record 3 s and play back</button>');
  let stream=null,raf=0,peak=0;
  panel("Microphone","Talk or clap. The bar must move. Then record and listen.",b,
        [["PASS","ok",()=>{post("Microphone","PASS","sound picked up (peak "+Math.round(peak*100)+"%), playback clear",peak>0.08);next()}],
         ["FAIL","bad",()=>{post("Microphone","FAIL","no / bad sound (peak "+Math.round(peak*100)+"%)");next()}]]);
  cleanup=()=>{cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop())};
  navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
    stream=s;AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();
    const src=AC.createMediaStreamSource(s),an=AC.createAnalyser();an.fftSize=1024;src.connect(an);
    const buf=new Float32Array(an.fftSize);
    const loop=()=>{an.getFloatTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v));
      peak=Math.max(peak,m);document.getElementById("lv").style.width=Math.min(100,m*140)+"%";raf=requestAnimationFrame(loop)};loop();
    document.getElementById("rec").onclick=()=>{
      if(!window.MediaRecorder){document.getElementById("mtxt").textContent="Recording not supported - judge by the bar";return}
      const r=new MediaRecorder(s),ch=[];r.ondataavailable=e=>ch.push(e.data);
      r.onstop=()=>{const a=new Audio(URL.createObjectURL(new Blob(ch)));a.play();
        document.getElementById("mtxt").textContent="Playing back - is it clear?"};
      r.start();document.getElementById("mtxt").textContent="Recording... talk now";setTimeout(()=>r.stop(),3000)};
  }).catch(e=>{document.getElementById("mtxt").textContent="Microphone blocked: "+e.name+
    " - allow it in the browser and try again"});
}
function camera(name,facing){
  const b=el('<video id="cv" autoplay playsinline muted></video><p id="ctxt" style="text-align:center"></p>'+
             '<button class="btn ghost" id="torch" style="display:none">Flash on / off</button>');
  let stream=null,torch=false;
  panel(name,"Is the picture clear and in focus, with no spots or cracks?",b,
        pf(name,"live picture clear","camera fault / no picture"));
  cleanup=()=>{if(stream)stream.getTracks().forEach(t=>t.stop())};
  navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:facing}},audio:false})
   .catch(()=>navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false}))
   .then(s=>{stream=s;document.getElementById("cv").srcObject=s;
     const tr=s.getVideoTracks()[0],cap=tr.getCapabilities?tr.getCapabilities():{};
     document.getElementById("ctxt").textContent=tr.label||"";
     if(cap.torch){const tb=document.getElementById("torch");tb.style.display="block";
       tb.onclick=()=>{torch=!torch;tr.applyConstraints({advanced:[{torch}]}).catch(()=>{})}}})
   .catch(e=>{document.getElementById("ctxt").textContent="Camera blocked or missing: "+e.name});
}
function vibration(){
  if(!navigator.vibrate){
    panel("Vibration","This browser cannot vibrate the phone (normal on iPhone). Flip the silent switch or change the volume - did it vibrate?",null,
      [["Yes - PASS","ok",()=>{post("Vibration","PASS","checked by hand");next()}],
       ["No - FAIL","bad",()=>{post("Vibration","FAIL","no vibration felt");next()}],
       ["Not fitted","ghost",()=>{post("Vibration","N/A","not tested");next()}]]);return}
  const b=el('<button class="btn" id="vb">Vibrate now</button>');
  panel("Vibration","Press the button. Did the phone vibrate?",b,pf("Vibration","vibration felt","no vibration"));
  document.getElementById("vb").onclick=()=>navigator.vibrate([400,150,400]);
}
function sensors(){
  const b=el('<div class="big" id="sv">tilt the phone</div><button class="btn" id="sp">Start</button>');
  let base=null,moved=0;
  const h=e=>{const a=e.accelerationIncludingGravity||{};if(a.x==null)return;
    if(!base)base=[a.x,a.y,a.z];
    const d=Math.abs(a.x-base[0])+Math.abs(a.y-base[1])+Math.abs(a.z-base[2]);
    moved=Math.max(moved,d);document.getElementById("sv").textContent=moved>6?"movement seen":"tilt the phone";
    if(moved>6){window.removeEventListener("devicemotion",h);post("Motion sensors","PASS","accelerometer responds to tilting",true);setTimeout(next,500)}};
  panel("Motion sensors","Press Start, then tilt and turn the phone.",b,
        [["FAIL","bad",()=>{post("Motion sensors","FAIL","no movement seen");next()}]]);
  cleanup=()=>window.removeEventListener("devicemotion",h);
  document.getElementById("sp").onclick=()=>{
    const go=()=>window.addEventListener("devicemotion",h);
    if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission){
      DeviceMotionEvent.requestPermission().then(r=>{if(r==="granted")go()}).catch(()=>{})} else go()};
}
function buttons(){
  const items=["Volume up","Volume down","Power / side button","Silent switch / home button",
    "Face ID / Touch ID / fingerprint","Earpiece (make a test call)","Proximity sensor (screen off during call)",
    "Charging port (charges on the station)","SIM tray reads a SIM","Bluetooth turns on"];
  const st={};
  const box=el("");
  items.forEach((it,i)=>{const r=document.createElement("div");r.className="chk";
    r.innerHTML='<span>'+it+'</span><span class="opts"><button data-v="1">OK</button><button data-v="2">Fault</button><button data-v="3">N/A</button></span>';
    r.querySelectorAll("button").forEach(bt=>bt.onclick=()=>{st[it]=+bt.dataset.v;
      r.querySelectorAll("button").forEach(x=>x.className="");bt.className="s"+bt.dataset.v});
    box.appendChild(r)});
  box.style.overflow="auto";box.style.maxHeight="62vh";
  panel("Buttons & ports","Check each one on the phone. N/A = this phone does not have it.",box,
   [["Save","ok",()=>{const miss=items.filter(i=>!st[i]);
      if(miss.length){alert("Please answer: "+miss[0]);return}
      const bad=items.filter(i=>st[i]===2);
      post("Buttons & ports",bad.length?"FAIL":"PASS",bad.length?"fault: "+bad.join(", "):
        "all checked ("+items.filter(i=>st[i]===3).length+" not fitted)");next()}]]);
}
// Wi-Fi works: this page was loaded over the network
post("Wi-Fi","PASS","test page loaded over Wi-Fi",true);
fetch("/t/"+TOKEN+"/state").then(r=>r.json()).then(s=>{Object.assign(R,s);draw()}).catch(draw);
draw();
</script>
</body>
</html>
