<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1D3FB8">
<title>ITAD PhoneSeal test</title>
<style>
/* PhoneSeal mobile tester - list layout: icon, test name, status,
   big tick box on the right, pencil to change a result by hand.
   Runs in the PhoneSeal Android app (window.PhoneSeal = extra tests)
   or in any phone browser (iPhone, or Android without the app). */
:root{--blue:#1D3FB8;--blue2:#2950D6;--ink:#1B2F8C;--bg:#ECEFF6;--row:#F7F8FC;
--line:#D5DBEA;--muted:#6B7899;--ok:#2E9E6B;--okbg:#CFEBDD;--bad:#D23B3B;--badbg:#F7D6D6;
--sel:#C9D8F2;--na:#8A94AD;--text:#14204A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
-webkit-user-select:none;user-select:none}
header{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;
padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px;letter-spacing:.3px}
.brand svg{flex:none}
.brand b{color:#8FD3FF}
.badge{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;line-height:1.05;text-align:right}
.meta{display:flex;justify-content:space-between;font-size:12px;opacity:.9;margin-top:8px}
.prog{height:6px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#7CF0B5;transition:width .4s}
main{padding:0 0 110px}
.t{display:flex;align-items:center;gap:14px;background:var(--row);border-bottom:1px solid var(--line);
padding:14px 14px 14px 16px;min-height:84px}
.t.sel{background:var(--sel)}
.t .ic{width:44px;height:44px;flex:none;color:#5A6488}
.t .n{flex:1;min-width:0}
.t .n div{font-weight:750;font-size:18px;color:var(--ink)}
.t .n small{display:block;font-size:15px;margin-top:4px;color:var(--muted);
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .n small.M{color:var(--bad)}.t .n small.OK{color:var(--ok)}.t .n small.F{color:var(--bad)}
.tick{width:52px;height:52px;flex:none;border-radius:12px;border:2px solid var(--line);
background:#fff;display:flex;align-items:center;justify-content:center}
.tick.PASS{background:var(--okbg);border-color:#9DD3B8;color:var(--ok)}
.tick.FAIL{background:var(--badbg);border-color:#EBA8A8;color:var(--bad)}
.tick.NA{background:#E3E6EE;border-color:#C8CEDC;color:var(--na)}
.edit{width:46px;height:46px;flex:none;border-radius:12px;border:2px solid #8EA3CF;background:transparent;
color:var(--ink);display:none;align-items:center;justify-content:center;padding:0}
.t.sel .edit{display:flex}
.btn{display:block;width:100%;border:0;border-radius:26px;padding:16px;font-size:17px;font-weight:750;
color:#fff;background:var(--blue2);margin-top:10px}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.ghost{background:transparent;border:2px solid #9AA8C8;color:var(--muted)}
.row{display:flex;gap:10px}.row .btn{flex:1}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
background:linear-gradient(0deg,var(--bg) 72%,rgba(236,239,246,0))}
.panel{position:fixed;inset:0;background:#fff;z-index:20;display:none;flex-direction:column;
padding:calc(16px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom))}
.panel.on{display:flex}
.panel h2{margin:4px 0 6px;font-size:24px;color:var(--ink)}
.panel p{color:var(--muted);margin:0 0 10px;line-height:1.4}
.grow{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;overflow:auto}
video{width:100%;max-height:52vh;border-radius:14px;background:#000;object-fit:cover}
.meter{width:100%;height:22px;background:#E3E8F3;border-radius:12px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--blue2)}
.big{font-size:40px;font-weight:800;color:var(--ink);text-align:center}
.mid{font-size:18px;font-weight:700;color:var(--ink);text-align:center}
.link{display:block;text-align:center;text-decoration:none}
.info{width:100%;background:var(--row);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.info div{display:flex;justify-content:space-between;padding:5px 0;font-size:16px}
.info b{color:var(--ink)}
#touch{position:fixed;inset:0;z-index:30;display:none;background:#000;touch-action:none}
#touch .bar{position:absolute;left:0;right:0;top:0;height:calc(54px + env(safe-area-inset-top));
padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;
padding-left:14px;padding-right:8px;background:rgba(29,63,184,.95);color:#fff;z-index:2}
#touch .bar button{border:0;border-radius:18px;background:var(--bad);color:#fff;font-weight:700;padding:8px 14px}
#grid{position:absolute;left:0;right:0;bottom:0;display:grid}
#grid div{border:1px solid #1B2A55;background:#0C1838}
#grid div.on{background:var(--ok);border-color:#1F7A52}
#color{position:fixed;inset:0;z-index:30;display:none}
#color span{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;
font-weight:700;mix-blend-mode:difference;color:#fff}
.chk{display:flex;align-items:center;justify-content:space-between;background:var(--row);border:1px solid var(--line);
border-radius:12px;padding:12px;margin-bottom:8px;font-size:16px;width:100%}
.chk .opts{flex:none}
.chk .opts button{border:0;border-radius:16px;margin-left:6px;padding:8px 12px;font-weight:750;background:#E3E8F3;color:var(--muted)}
.chk .opts button.s1{background:var(--ok);color:#fff}.chk .opts button.s2{background:var(--bad);color:#fff}
.chk .opts button.s3{background:#64748B;color:#fff}
.chk .auto{font-size:13px;color:var(--muted);margin-right:6px}
#done{text-align:center;padding:26px 16px;display:none}
#done .big{color:var(--ok)}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30"><rect x="16" y="1" width="7" height="7" fill="#38BDF8"/><rect x="9" y="8" width="7" height="7" fill="#22C55E"/><rect x="16" y="8" width="7" height="7" fill="#14B8A6"/><rect x="2" y="15" width="7" height="7" fill="#FBBF24"/><rect x="9" y="15" width="7" height="7" fill="#22C55E"/><rect x="9" y="22" width="7" height="7" fill="#F97316"/></svg>
      <span>IT<b>AD</b> PhoneSeal</span>
    </div>
    <div class="badge"><span>Mobile<br>Tester</span>
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="15" height="24" rx="3"/><path d="M14 20l6 6 12-14"/></svg>
    </div>
  </div>
  <div class="meta"><span>Job: __JOB__</span><span id="mode"></span><span><span id="count">0</span> / <span id="total">0</span> done</span></div>
  <div class="prog"><i id="bar"></i></div>
</header>
<main id="list"></main>
<div id="done"><div class="big">All done</div>
<p style="color:var(--muted)">The results are on the station. You can put this phone down.</p></div>
<div id="bottom"><button class="btn" id="runall">Start tests</button></div>

<!-- generic test panel -->
<div class="panel" id="panel">
  <h2 id="ptitle"></h2><p id="ptext"></p>
  <div class="grow" id="pbody"></div>
  <div id="pbtns"></div>
</div>
<!-- touch grid -->
<div id="touch"><div class="bar"><b id="tleft">Swipe over every square</b>
<button id="tfail">Dead spot - FAIL</button></div><div id="grid"></div></div>
<!-- colour test -->
<div id="color"><span>Tap for the next colour</span></div>

<script>
"use strict";
const TOKEN="__TOKEN__";
// ---------- the PhoneSeal Android app (if this page runs inside it) ----------
const N=window.PhoneSeal||null;
let F={};                                    // what the phone has (from the app)
try{if(N)F=JSON.parse(N.info())}catch(e){}
const H={};                                  // listeners for app events
window.nativeEvent=(k,a,b)=>{const h=H[k];if(h)try{h(a,b)}catch(e){}};
const has=k=>!N||F[k]!==false;               // without the app: assume it is fitted
const viaUSB=location.hostname==="127.0.0.1"||location.hostname==="localhost";

// ---------- line icons (drawn with SVG, no pictures needed) ----------
const I={
 battery:'<rect x="13" y="7" width="18" height="32" rx="3"/><path d="M19 4h6"/><path d="M23 14l-5 9h7l-5 9"/>',
 touch:'<path d="M18 22V11a3 3 0 0 1 6 0v10"/><path d="M24 18a3 3 0 0 1 6 0v4"/><path d="M30 21a3 3 0 0 1 6 0v7c0 7-4 12-11 12h-2c-4 0-6-2-8-5l-5-8a3 3 0 0 1 5-3l3 4"/><path d="M13 13a8 8 0 0 1 16 0"/>',
 multi:'<circle cx="15" cy="15" r="5"/><circle cx="31" cy="15" r="5"/><path d="M15 20v14M31 20v14M10 40h26"/>',
 phone:'<path d="M14 6l6 1 3 8-4 3a20 20 0 0 0 9 9l3-4 8 3 1 6c0 3-3 5-6 5C20 37 9 26 9 12c0-3 2-6 5-6z"/><path d="M28 8a10 10 0 0 1 8 8M28 3a15 15 0 0 1 13 13"/>',
 mic:'<rect x="16" y="4" width="12" height="22" rx="6"/><path d="M10 21a12 12 0 0 0 24 0M22 33v8M15 41h14"/>',
 speaker:'<path d="M8 17h7l9-8v26l-9-8H8z"/><path d="M30 16a8 8 0 0 1 0 12M34 11a14 14 0 0 1 0 22"/>',
 ear:'<rect x="13" y="4" width="18" height="36" rx="4"/><path d="M18 9h8"/><path d="M36 6a6 6 0 0 1 0 8M39 3a10 10 0 0 1 0 14"/>',
 head:'<path d="M8 30v-6a14 14 0 0 1 28 0v6"/><rect x="6" y="28" width="7" height="11" rx="3"/><rect x="31" y="28" width="7" height="11" rx="3"/>',
 buttons:'<rect x="15" y="7" width="14" height="30" rx="3"/><path d="M12 14v6M32 14v4M7 18l3 3-3 3M37 18l-3 3 3 3"/>',
 vibrate:'<rect x="15" y="8" width="14" height="26" rx="3" transform="rotate(-18 22 21)"/><path d="M8 13l-3 4 3 4M37 22l3 4-3 4M10 30l-2 4M34 9l2-4"/>',
 colors:'<path d="M5 12h8M20 12h8M5 22h3M15 22h13M5 32h12M24 32h4"/><circle cx="16" cy="12" r="3"/><circle cx="11" cy="22" r="3"/><circle cx="20" cy="32" r="3"/><text x="33" y="15" font-size="8" stroke-width="1">R</text><text x="33" y="25" font-size="8" stroke-width="1">G</text><text x="33" y="35" font-size="8" stroke-width="1">B</text>',
 camera:'<path d="M6 15h8l3-5h10l3 5h8v22H6z"/><circle cx="22" cy="25" r="7"/>',
 rear:'<path d="M6 15h8l3-5h10l3 5h8v22H6z"/><circle cx="22" cy="25" r="7"/><path d="M8 40a16 6 0 0 0 28 0"/><path d="M33 37l3 3-3 3"/>',
 flash:'<path d="M25 4L11 25h10l-3 15 15-22H23z"/>',
 prox:'<circle cx="15" cy="16" r="6"/><path d="M5 38c0-7 4-12 10-12s10 5 10 12z"/><rect x="31" y="10" width="9" height="16" rx="2"/>',
 motion:'<rect x="15" y="9" width="14" height="26" rx="3" transform="rotate(20 22 22)"/><path d="M6 30a17 17 0 0 0 10 10M38 14A17 17 0 0 0 28 4"/>',
 wifi:'<path d="M5 18a25 25 0 0 1 34 0M10 24a17 17 0 0 1 24 0M15 30a9 9 0 0 1 14 0"/><circle cx="22" cy="36" r="2"/>',
 bt:'<rect x="11" y="4" width="22" height="36" rx="11"/><path d="M17 15l10 9-5 5V11l5 5-10 9"/>'
};
const svg=(k,w)=>'<svg viewBox="0 0 44 44" width="'+(w||44)+'" height="'+(w||44)+'" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+I[k]+'</svg>';
const TICK='<svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6 6 12-13"/></svg>';
const CROSS='<svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M6 6l14 14M20 6L6 20"/></svg>';
const DASH='<svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M6 13h14"/></svg>';
const PEN='<svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4H5v17h17v-9"/><path d="M19 3l4 4-10 10H9v-4z"/></svg>';

// id = the name the station and the report use (do not rename).
// req = true: Mandatory, false: Optional. Tests the app can do by itself
// are Mandatory in the app and Optional in a browser (checked by hand).
const TESTS=[
 {id:"Charging",        label:"Battery",        ic:"battery", req:true,  d:"Plug in the cable - the phone must charge"},
 {id:"Touch screen",    label:"Touch screen",   ic:"touch",   req:true,  d:"Swipe your finger over every square"},
 {id:"Multi-touch",     label:"Multi-touch",    ic:"multi",   req:true,  d:"Touch the screen with two fingers"},
 {id:"Telephony",       label:"Telephony",      ic:"phone",   req:false, d:"SIM signal and a test call"},
 {id:"Microphone",      label:"Microphone",     ic:"mic",     req:true,  d:"Talk, then listen to the recording"},
 {id:"Speakers",        label:"Speaker",        ic:"speaker", req:true,  d:"Play a tone and listen"},
 {id:"Earpiece",        label:"Earpiece",       ic:"ear",     req:!!N,   d:"The small call speaker at the top"},
 {id:"Headphones",      label:"Headphones",     ic:"head",    req:false, d:"Headphone socket (if fitted)"},
 {id:"Buttons & ports", label:"Buttons",        ic:"buttons", req:true,  d:"Press each button"},
 {id:"Vibration",       label:"Vibration",      ic:"vibrate", req:false, d:"The phone vibrates"},
 {id:"Display",         label:"Screen colors",  ic:"colors",  req:true,  d:"Full-screen colours: dead pixels or lines"},
 {id:"Front camera",    label:"Front camera",   ic:"camera",  req:true,  d:"Live picture from the front camera"},
 {id:"Rear camera",     label:"Back camera",    ic:"rear",    req:true,  d:"Live picture from the back camera"},
 {id:"Flash light",     label:"Flash light",    ic:"flash",   req:!!N&&has("flash"),     d:"The camera flash turns on"},
 {id:"Proximity sensor",label:"Proximity",      ic:"prox",    req:!!N&&has("proximity"), d:"Cover the top of the phone"},
 {id:"Motion sensors",  label:"Accelerometer",  ic:"motion",  req:true,  d:"Tilt and turn the phone"},
 {id:"Wi-Fi",           label:"Wi-Fi",          ic:"wifi",    req:false, d:"Wi-Fi turns on and finds networks"},
 {id:"Bluetooth",       label:"Bluetooth",      ic:"bt",      req:false, d:"Bluetooth turns on"}
];
const R={};               // results {id:{status,note,auto}}
let queue=null;           // run-all order
let sel=null;             // selected row (shows the pencil)

function post(name,status,note,auto){
  R[name]={status,note:note||"",auto:!!auto};
  fetch("/t/"+TOKEN+"/result",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name,status,note,auto})}).catch(()=>{});
  draw();
}
function statusLine(t){
  const r=R[t.id];
  if(!r) return t.req?['M',"Mandatory"]:['',"Optional"];
  if(r.status==="PASS") return ['OK',"OK"+(r.note?" - "+r.note:"")];
  if(r.status==="FAIL") return ['F',"Fault"+(r.note?" - "+r.note:"")];
  return ['',"Not tested"+(r.note?" - "+r.note:"")];
}
function draw(){
  const L=document.getElementById("list"); L.innerHTML="";
  TESTS.forEach(t=>{
    const r=R[t.id]; const s=r?r.status:"";
    const [cls,txt]=statusLine(t);
    const row=document.createElement("div"); row.className="t"+(sel===t.id?" sel":"");
    const tk=s==="PASS"?"PASS":s==="FAIL"?"FAIL":s?"NA":"";
    row.innerHTML='<div class="ic">'+svg(t.ic)+'</div>'+
      '<div class="n"><div>'+t.label+'</div><small class="'+cls+'">'+txt.replace(/</g,"&lt;")+'</small></div>'+
      '<div class="tick '+tk+'">'+(tk==="PASS"?TICK:tk==="FAIL"?CROSS:tk==="NA"?DASH:"")+'</div>'+
      '<button class="edit" aria-label="Change result">'+PEN+'</button>';
    row.onclick=()=>{
      if(!r){queue=null;run(t.id);return}
      if(sel===t.id){queue=null;run(t.id);return}   // second tap: test again
      sel=t.id;draw();
    };
    row.querySelector(".edit").onclick=e=>{e.stopPropagation();edit(t)};
    L.appendChild(row);
  });
  const n=TESTS.filter(t=>R[t.id]).length;
  const mand=TESTS.filter(t=>t.req&&!R[t.id]).length;
  document.getElementById("count").textContent=n;
  document.getElementById("total").textContent=TESTS.length;
  document.getElementById("mode").textContent=N?"App "+(F.app||""):"Browser";
  document.getElementById("bar").style.width=(100*n/TESTS.length)+"%";
  const b=document.getElementById("runall");
  if(n===TESTS.length){
    document.getElementById("done").style.display="block";
    document.getElementById("bottom").style.display="none";
  } else if(!mand){
    b.textContent="Finish (skip optional tests)";b.className="btn ok";
  } else {
    b.textContent=n>0?"Continue tests ("+mand+" mandatory left)":"Start tests";b.className="btn";
  }
}
// change a result by hand (pencil)
function edit(t){
  queue=null;
  panel(t.label,"Change the result by hand, or run the test again.",null,
    [["OK","ok",()=>{post(t.id,"PASS","set by hand");next()}],
     ["Fault","bad",()=>{post(t.id,"FAIL","set by hand");next()}]],
    [["Not fitted / not tested","ghost",()=>{post(t.id,"N/A","set by hand");next()}],
     ["Run the test again","",()=>{closePanel();run(t.id)}]]);
}
function next(){
  closePanel();
  if(!queue) return;
  const t=queue.shift(); if(t) run(t); else queue=null;
}
document.getElementById("runall").onclick=()=>{
  if(!TESTS.some(t=>t.req&&!R[t.id])){
    TESTS.filter(t=>!R[t.id]).forEach(t=>post(t.id,"N/A","optional - not tested"));
    return;
  }
  queue=TESTS.filter(t=>!R[t.id]).map(t=>t.id); next();
};
// ---------- panel helpers ----------
const P=document.getElementById("panel");
let cleanup=null;
function panel(title,text,body,buttons,extra){
  document.getElementById("ptitle").textContent=title;
  document.getElementById("ptext").textContent=text;
  const B=document.getElementById("pbody"); B.innerHTML=""; if(body) B.appendChild(body);
  const K=document.getElementById("pbtns"); K.innerHTML="";
  const row=document.createElement("div"); row.className="row";
  buttons.forEach(([label,cls,fn])=>{const b=document.createElement("button");
    b.className="btn "+cls; b.textContent=label; b.onclick=fn; row.appendChild(b)});
  K.appendChild(row);
  (extra||[]).forEach(([label,cls,fn])=>{const b=document.createElement("button");
    b.className="btn "+cls; b.textContent=label; b.onclick=fn; K.appendChild(b)});
  const skip=document.createElement("button"); skip.className="btn ghost"; skip.textContent="Skip for now";
  skip.onclick=next; K.appendChild(skip);
  P.classList.add("on");
}
function closePanel(){P.classList.remove("on"); if(cleanup){try{cleanup()}catch(e){} cleanup=null}}
function pf(name,okNote,badNote,auto){
  return [["OK","ok",()=>{post(name,"PASS",okNote,auto);next()}],
          ["Fault","bad",()=>{post(name,"FAIL",badNote,auto);next()}]];
}
const NA=(name,label)=>[[label||"Not fitted","ghost",()=>{post(name,"N/A","not fitted");next()}]];
function el(html){const d=document.createElement("div");d.style.width="100%";d.innerHTML=html;return d}
const $=id=>document.getElementById(id);
function autoPass(name,note){post(name,"PASS",note,true);setTimeout(next,700)}
// ---------- tests ----------
function run(id){
  sel=id;
  ({"Charging":charging,"Touch screen":touch,"Multi-touch":multi,"Telephony":telephony,
    "Microphone":mic,"Speakers":speakers,"Earpiece":earpiece,"Headphones":headphones,
    "Buttons & ports":buttons,"Vibration":vibration,"Display":display,
    "Front camera":()=>camera("Front camera","user"),"Rear camera":()=>camera("Rear camera","environment"),
    "Flash light":flash,"Proximity sensor":proximity,"Motion sensors":sensors,
    "Wi-Fi":wifi,"Bluetooth":bluetooth})[id]();
}
function charging(){
  if(N){
    const b=el('<div class="info" id="bi"></div><p id="bt" class="mid" style="margin-top:12px"></p>');
    panel("Battery","Plug the phone into the station cable. It must charge.",b,
      [["OK","ok",()=>{post("Charging","PASS",note());next()}],
       ["Fault","bad",()=>{post("Charging","FAIL",note()+" - check cable / port / battery");next()}]]);
    let d={};
    const note=()=>(d.level!=null?d.level+"%, ":"")+(d.charging?"charging ("+d.plugged+")":"NOT charging")+
      ", health "+(d.health||"?")+(d.temp_c?", "+d.temp_c+" C":"");
    const show=()=>{
      $("bi").innerHTML=[["Charge",d.level+"%"],["Charging",d.charging?"Yes ("+d.plugged+")":"No"],
        ["Health",d.health],["Temperature",d.temp_c+" C"],["Voltage",d.voltage+" V"],["Type",d.technology||"-"]]
        .map(x=>'<div><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join("");
      const bad=d.health&&!/Good|Unknown/.test(d.health);
      $("bt").textContent=bad?"Battery reports: "+d.health:d.charging?"Charging - OK":"Not charging - plug in the cable";
      $("bt").style.color=bad?"var(--bad)":d.charging?"var(--ok)":"var(--bad)";
      if(bad){H.battery=null;post("Charging","FAIL",note(),true);setTimeout(next,1200);return}
      if(d.charging){H.battery=null;autoPass("Charging",note())}};
    try{d=JSON.parse(N.battery())}catch(e){}
    H.battery=j=>{try{d=JSON.parse(j);show()}catch(e){}};
    cleanup=()=>{H.battery=null};show();return;
  }
  const b=el('<div class="big">'+svg("battery",90)+'</div><p id="bt" style="text-align:center">Plug the phone into the station cable.</p>');
  panel("Battery","Is the phone charging from the cable?",b,
    [["Charging - OK","ok",()=>{post("Charging","PASS","charging from the cable");next()}],
     ["Not charging","bad",()=>{post("Charging","FAIL","does not charge - check cable / port / battery");next()}]]);
  if(!navigator.getBattery){
    $("bt").textContent="Look for the charging symbol on the phone's status bar.";return}
  navigator.getBattery().then(bat=>{
    const show=()=>{$("bt").textContent=Math.round(bat.level*100)+"% - "+
      (bat.charging?"charging":"NOT charging - plug in the cable");
      if(bat.charging){bat.onchargingchange=null;autoPass("Charging","charging, "+Math.round(bat.level*100)+"%")}};
    bat.onchargingchange=show;cleanup=()=>{bat.onchargingchange=null};show();
  }).catch(()=>{});
}
function touch(){
  const T=$("touch"),G=$("grid");
  const cols=6,rows=11; G.innerHTML="";
  G.style.top=document.querySelector("#touch .bar").offsetHeight+"px";
  G.style.gridTemplateColumns="repeat("+cols+",1fr)";G.style.gridTemplateRows="repeat("+rows+",1fr)";
  for(let i=0;i<cols*rows;i++){G.appendChild(document.createElement("div"))}
  T.style.display="block"; let left=cols*rows;
  $("tleft").textContent="Swipe over every square";
  const hit=(x,y)=>{const e=document.elementFromPoint(x,y);
    if(e&&e.parentNode===G&&!e.classList.contains("on")){e.classList.add("on");left--;
      $("tleft").textContent=left?left+" squares left":"All squares done";
      if(!left){setTimeout(()=>{T.style.display="none";post("Touch screen","PASS","all "+cols*rows+" squares",true);next()},300)}}};
  const mv=e=>{e.preventDefault();for(const t of e.touches)hit(t.clientX,t.clientY)};
  T.ontouchstart=mv;T.ontouchmove=mv;
  T.onmousemove=e=>{if(e.buttons)hit(e.clientX,e.clientY)};
  $("tfail").onclick=()=>{T.style.display="none";
    post("Touch screen","FAIL",left+" squares could not be touched",false);next()};
}
function multi(){

}

let AC=null;
function tone(pan){
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  AC.resume&&AC.resume();
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.value=660;g.gain.value=0.0001;
  let node=g;
  if(AC.createStereoPanner&&pan!==0){const p=AC.createStereoPanner();p.pan.value=pan;g.connect(p);node=p}
  o.connect(g);node.connect(AC.destination);
  const t=AC.currentTime;g.gain.exponentialRampToValueAtTime(0.6,t+0.05);
  g.gain.exponentialRampToValueAtTime(0.0001,t+1.2);o.start(t);o.stop(t+1.3);
}
function speakers(){
  const b=el('<div class="row"><button class="btn ghost" id="sl">Left</button>'+
    '<button class="btn" id="sb">Both</button><button class="btn ghost" id="sr">Right</button></div>'+

  panel("Speaker","Play the tone. Is it clear, with no crackling?",b,

function mic(){
  const b=el('<div class="meter"><i id="lv"></i></div><p id="mtxt" style="text-align:center">Allow the microphone, then talk.</p>'+
    '<button class="btn" id="rec">Record 3 s and play back</button>');
  let stream=null,raf=0,peak=0;
  panel("Microphone","Talk or clap. The bar must move. Then record and listen.",b,
        [["OK","ok",()=>{post("Microphone","PASS","sound picked up (peak "+Math.round(peak*100)+"%)",peak>0.08);next()}],
         ["Fault","bad",()=>{post("Microphone","FAIL","no / bad sound (peak "+Math.round(peak*100)+"%)");next()}]]);
  cleanup=()=>{cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop())};
  navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
    stream=s;AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();
    const src=AC.createMediaStreamSource(s),an=AC.createAnalyser();an.fftSize=1024;src.connect(an);
    const buf=new Float32Array(an.fftSize);
    const loop=()=>{an.getFloatTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v));
      peak=Math.max(peak,m);$("lv").style.width=Math.min(100,m*140)+"%";raf=requestAnimationFrame(loop)};loop();
    $("rec").onclick=()=>{
      if(!window.MediaRecorder){$("mtxt").textContent="Recording not supported - judge by the bar";return}
      const r=new MediaRecorder(s),ch=[];r.ondataavailable=e=>ch.push(e.data);
      r.onstop=()=>{const a=new Audio(URL.createObjectURL(new Blob(ch)));a.play();
        $("mtxt").textContent="Playing back - is it clear?"};
      r.start();$("mtxt").textContent="Recording... talk now";setTimeout(()=>r.stop(),3000)};
  }).catch(e=>{$("mtxt").textContent="Microphone blocked: "+e.name+" - allow it and try again"});
}

function buttons(){
  // with the app: volume up / down and power are ticked by themselves
  const autoKeys=N?{"Volume up":"Volume up","Volume down":"Volume down","Power / side button":"screen"}:{};
  const items=["Volume up","Volume down","Power / side button","Silent switch / home button",
    "Face ID / Touch ID / fingerprint","Charging port","SIM tray reads a SIM"];
  const st={};
  const box=el("");
  items.forEach(it=>{const r=document.createElement("div");r.className="chk";r.dataset.k=it;
    r.innerHTML='<span>'+it+(autoKeys[it]?'<br><span class="auto">press it - ticks by itself</span>':'')+'</span>'+
      '<span class="opts"><button data-v="1">OK</button><button data-v="2">Fault</button><button data-v="3">N/A</button></span>';
    r.querySelectorAll("button").forEach(bt=>bt.onclick=()=>set(it,+bt.dataset.v));
    box.appendChild(r)});
  box.style.overflow="auto";box.style.maxHeight="62vh";
  function set(it,v){st[it]=v;const r=box.querySelector('[data-k="'+it+'"]');
    r.querySelectorAll(".opts button").forEach(x=>x.className=+x.dataset.v===v?"s"+v:"")}
  panel("Buttons","Press each button on the phone. N/A = this phone does not have it.",box,
   [["Save","ok",()=>{const miss=items.filter(i=>!st[i]);
      if(miss.length){alert("Please answer: "+miss[0]);return}
      const bad=items.filter(i=>st[i]===2);
      post("Buttons & ports",bad.length?"FAIL":"PASS",bad.length?bad.join(", "):
        "all checked ("+items.filter(i=>st[i]===3).length+" not fitted)",!!N);next()}]]);
  if(N){
    if(!F.fingerprint) set("Face ID / Touch ID / fingerprint",3);
    N.keys(true);
    H.key=k=>{if(autoKeys[k])set(k,1)};
    H.screen=s=>{if(s==="on")set("Power / side button",1)};
    cleanup=()=>{N.keys(false);H.key=null;H.screen=null};
  }
}
function vibration(){

    if(!N.hasVibrator()){post("Vibration","N/A","no vibration motor",true);setTimeout(next,500);return}

      [["Yes - OK","ok",()=>{post("Vibration","PASS","checked by hand");next()}],
       ["No - Fault","bad",()=>{post("Vibration","FAIL","no vibration felt");next()}]],NA("Vibration"));return}

function display(){
  const C=$("color");
  const cols=[["#FF0000","Red"],["#00FF00","Green"],["#0000FF","Blue"],["#FFFFFF","White"],["#000000","Black"],["#808080","Grey"]];
  let i=0; C.style.display="block"; C.style.background=cols[0][0];
  try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}
  C.onclick=()=>{i++; if(i<cols.length){C.style.background=cols[i][0];return}
    C.style.display="none"; try{document.exitFullscreen&&document.exitFullscreen()}catch(e){}
    panel("Screen colors","Did you see dead pixels, lines, marks or burn-in on any colour?",null,
      [["No - OK","ok",()=>{post("Display","PASS","6 colours, no faults");next()}],
       ["Yes - Fault","bad",()=>{post("Display","FAIL","fault seen on the display");next()}]]);};
}
function camera(name,facing){
  const b=el('<video id="cv" autoplay playsinline muted></video><p id="ctxt" style="text-align:center"></p>');
  let stream=null;
  panel(name==="Rear camera"?"Back camera":name,"Is the picture clear and in focus, with no spots or cracks?",b,
        pf(name,"live picture clear","camera fault / no picture"));

  navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:facing}},audio:false})
   .catch(()=>navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false}))
   .then(s=>{stream=s;$("cv").srcObject=s;$("ctxt").textContent=s.getVideoTracks()[0].label||""})
   .catch(e=>{$("ctxt").textContent="Camera blocked or missing: "+e.name});

function flash(){
  if(N){
    if(!F.flash){post("Flash light","N/A","no flash fitted",true);setTimeout(next,500);return}
    let on=false;
    const b=el('<div class="big" id="fl" style="color:var(--muted)">'+svg("flash",90)+'</div>'+
      '<button class="btn" id="ft">Flash on / off</button>');

          pf("Flash light","flash light works","flash does not light"));

    $("ft").onclick=tog;tog();
    cleanup=()=>{N.torch(false)};return;
  }
  // browser: use the back camera's torch where the browser allows it
  const b=el('<video id="cv" autoplay playsinline muted style="max-height:30vh"></video>'+
    '<p id="ctxt" style="text-align:center"></p><button class="btn" id="ft" style="display:none">Flash on / off</button>');
  let stream=null,on=false;

        pf("Flash light","flash light works","flash does not light"),NA("Flash light","No flash"));
  cleanup=()=>{if(stream)stream.getTracks().forEach(t=>t.stop())};
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}).then(s=>{
    stream=s;$("cv").srcObject=s;const tr=s.getVideoTracks()[0],cap=tr.getCapabilities?tr.getCapabilities():{};
    if(cap.torch){$("ft").style.display="block";$("ft").onclick=()=>{on=!on;tr.applyConstraints({advanced:[{torch:on}]}).catch(()=>{})}}
    else $("ctxt").textContent="This browser cannot switch the flash. Open the camera app, turn the flash on and check by hand.";
  }).catch(e=>{$("ctxt").textContent="Camera blocked: "+e.name});
}
function proximity(){
  if(N&&F.proximity){
    const b=el('<div class="big" id="px">'+svg("prox",90)+'</div><p id="pt" class="mid">Cover the top of the phone with your hand</p>');
    let near=false,seenNear=false;
    panel("Proximity","Cover the top of the screen (near the front camera) with your hand, then take it away.",b,
          [["Fault","bad",()=>{post("Proximity sensor","FAIL",seenNear?"does not go back to far":"does not react to a hand");next()}]]);
    H.proximity=(v,max)=>{near=v<Math.min(max,5)||v<max;
      $("px").style.color=near?"var(--ok)":"var(--ink)";
      if(near){seenNear=true;$("pt").textContent="Hand seen - now take it away"}
      else if(seenNear){H.proximity=null;N.sensor("proximity",false);autoPass("Proximity sensor","reacts to a hand (near and far)")}};
    N.sensor("proximity",true);
    cleanup=()=>{H.proximity=null;N.sensor("proximity",false)};return;
  }
  if(N&&!F.proximity){post("Proximity sensor","N/A","no proximity sensor",true);setTimeout(next,500);return}
  panel("Proximity","Make a test call and hold the phone to your ear: the screen must go dark, and light up again when you move it away.",null,
        pf("Proximity sensor","screen turns off at the ear","screen stays on at the ear"),NA("Proximity sensor","No SIM to test"));
}
function sensors(){
  const b=el('<div class="big" id="sv">'+svg("motion",90)+'</div><p id="st" class="mid">Tilt and turn the phone</p>'+
    (N?'':'<button class="btn" id="sp">Start</button>'));
  let base=null,moved=0;
  const seen=d=>{moved=Math.max(moved,d);
    if(moved>6){$("st").textContent="Movement seen";$("sv").style.color="var(--ok)";
      stop();autoPass("Motion sensors","responds to tilting")}};
  const h=e=>{const a=e.accelerationIncludingGravity||{};if(a.x==null)return;
    if(!base)base=[a.x,a.y,a.z];
    seen(Math.abs(a.x-base[0])+Math.abs(a.y-base[1])+Math.abs(a.z-base[2]))};
  let nb=null;
  const stop=()=>{window.removeEventListener("devicemotion",h);if(N){H.accel=null;N.sensor("accel",false)}};
  panel("Accelerometer","Tilt and turn the phone.",b,
        [["Fault","bad",()=>{post("Motion sensors","FAIL","no movement seen");next()}]]);
  cleanup=stop;
  if(N){
    if(!F.accel){post("Motion sensors","FAIL","no accelerometer found",true);setTimeout(next,600);return}
    H.accel=(xy,z)=>{if(nb==null)nb=[xy,z];seen(Math.abs(xy-nb[0])+Math.abs(z-nb[1]))};
    N.sensor("accel",true);return;
  }
  $("sp").onclick=()=>{
    const go=()=>window.addEventListener("devicemotion",h);
    if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission){
      DeviceMotionEvent.requestPermission().then(r=>{if(r==="granted")go()}).catch(()=>{})} else go()};
}
function radio(name,label,ic,read,settings,okNote){
  // Wi-Fi / Bluetooth with the app: ticks by itself when it is on
  const b=el('<div class="big" id="rv">'+svg(ic,90)+'</div><p id="rt" class="mid"></p>'+
    '<button class="btn" id="ro">Open '+label+' settings</button>');
  panel(label,"Turn "+label+" on. It is ticked by itself when it works.",b,
        pf(name,okNote(),"does not turn on"),NA(name,"Not fitted"));
  const chk=()=>{let d={};try{d=JSON.parse(read())}catch(e){}
    if(d.present===false){clearInterval(iv);post(name,"N/A","not fitted",true);setTimeout(next,500);return}
    const ok=d.enabled&&(name!=="Wi-Fi"||d.networks>0);
    $("rt").textContent=!d.enabled?label+" is OFF - turn it on":ok?"Working":"On - looking for networks...";
    $("rv").style.color=ok?"var(--ok)":"var(--ink)";
    if(ok){clearInterval(iv);autoPass(name,okNote(d))}};
  $("ro").onclick=()=>settings();
  const iv=setInterval(chk,1500);chk();
  cleanup=()=>clearInterval(iv);
}
